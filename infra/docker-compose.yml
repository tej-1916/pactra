# Runtime dependencies for PACTRA (development only). Not required to run the
# Phase 1 unit test suite, which uses in-memory SQLite.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pactra
      POSTGRES_PASSWORD: pactra
      POSTGRES_DB: pactra
    ports:
      - "5432:5432"
    volumes:
      - pactra_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pactra_pg:
