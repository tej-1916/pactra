[project]
name = "pactra"
version = "0.1.0"
description = "PACTRA — Adversarial Transaction Security Kernel for Agentic Commerce (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
    # Sync driver for Alembic against PostgreSQL. psycopg 3 rather than
    # psycopg2: psycopg2 publishes no wheel for the Python version this
    # project targets, and v3 is the maintained successor.
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Flat layout with several top-level packages: discovery must be explicit,
# otherwise setuptools refuses to build (and `pip install -e .` fails).
[tool.setuptools.packages.find]
include = ["apps*", "packages*", "services*"]
exclude = ["infra*", "docs*", "tests*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "postgres: integration test requiring a real PostgreSQL server (Phase 4)",
    "attack_lab: adversarial attack lab / evaluation harness test (Phase 6)",
    "slow: drives the full risk-evaluation corpus end to end (Phase 7)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "services", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# These UP rules recommend 3.11/3.12-only syntax (StrEnum, datetime.UTC,
# PEP 695 type parameters). We keep broadly compatible forms on purpose.
ignore = ["UP042", "UP017", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() in argument defaults is the intended idiom.
"apps/api/pactra/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
